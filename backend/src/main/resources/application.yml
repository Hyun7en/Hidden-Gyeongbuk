spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hidden_gyeongbuk}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

tourapi:
  service-key: ${TOURAPI_SERVICE_KEY:}
  kor-base-url: https://apis.data.go.kr/B551011/KorService2
  eng-base-url: https://apis.data.go.kr/B551011/EngService2
  mobile-os: ETC
  mobile-app: HiddenGyeongbuk

sync:
  # 초기 전체 적재가 끝나기 전까지는 false 유지 (TourAPI 개발계정 일 1,000건 호출 한도)
  enabled: ${SYNC_ENABLED:false}
  cron: ${SYNC_CRON:0 0 3 * * *}

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com/v1beta
  # 실측 미검증 — 처음 호출 시 모델명 오류가 나면 Google AI Studio에서 최신 모델명으로 교체할 것.
  model: ${GEMINI_MODEL:gemini-2.0-flash}
