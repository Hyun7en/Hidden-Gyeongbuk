spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hidden_gyeongbuk}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

tourapi:
  service-key: ${TOURAPI_SERVICE_KEY:}
  kor-base-url: https://apis.data.go.kr/B551011/KorService2
  eng-base-url: https://apis.data.go.kr/B551011/EngService2
  mobile-os: ETC
  mobile-app: HiddenGyeongbuk
