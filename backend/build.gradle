plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hiddengyeongbuk'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// *IT 클래스는 실제 DB·외부 API가 필요한 통합 테스트라 기본 test에서 제외한다.
	// 실행: ./gradlew integrationTest
	exclude '**/*IT.class'
}

tasks.register('integrationTest', Test) {
	useJUnitPlatform()
	include '**/*IT.class'
	shouldRunAfter test
}

// ─────────────────────────────────────────────────────────────────────────────
// React 정적 번들을 실행 가능 jar 안에 넣는다(아키텍처 §8, ADR-002).
//
// bootJar에만 건다 — test·bootRun은 그대로다. 개발은 Vite dev 서버가 /api를 프록시하므로
// (vite.config.ts) 번들이 필요 없고, 여기에 걸면 매 테스트마다 npm이 도는 셈이 된다.
// 번들이 필요한 것은 "배포되는 산출물"뿐이다.
//
// Docker 빌드는 node 스테이지에서 이미 만든 dist를 넣어 주므로 -PskipFrontendBuild로
// npm 단계만 건너뛰고 복사만 한다.
// ─────────────────────────────────────────────────────────────────────────────
def frontendDir = file("${rootDir}/../frontend")
def frontendDist = file("${frontendDir}/dist")

tasks.register('buildFrontend', Exec) {
	description = 'React 번들을 빌드한다 (frontend/dist)'
	workingDir = frontendDir
	// npm ci는 package-lock.json을 정본으로 삼아 재현 가능한 설치를 한다.
	commandLine 'sh', '-c', 'npm ci && npm run build'
	onlyIf {
		if (project.hasProperty('skipFrontendBuild')) {
			logger.lifecycle('skipFrontendBuild — 이미 만들어진 frontend/dist를 그대로 쓴다')
			return false
		}
		return true
	}
}

// build/resources/main 에 복사하지 않고 jar에 직접 넣는다.
// 그 디렉터리는 processResources의 출력이라, 거기에 끼어들면 test·bootRun까지 이 태스크에
// 의존하게 되고(resolveMainClassName이 같은 경로를 읽는다) 테스트 한 번 돌릴 때마다 npm이 돈다.
tasks.named('bootJar') {
	dependsOn 'buildFrontend'
	from(frontendDist) { into 'BOOT-INF/classes/static' }
	// 번들이 없는데 조용히 빈 jar를 만들면 배포한 뒤에야 / 가 404인 것으로 드러난다. 여기서 끊는다.
	doFirst {
		if (!frontendDist.exists()) {
			throw new GradleException(
					"frontend/dist가 없다 — frontend/ 에서 npm run build 를 먼저 돌릴 것. " +
					"이대로 만들면 정적 파일 없는 jar가 나오고, 배포 후에야 드러난다.")
		}
	}
}

tasks.withType(Test).configureEach {
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
		showStackTraces = true
		showExceptions = true
		showCauses = true
		showStandardStreams = true
	}
}

// 루트 .env를 읽어 bootRun/test/integrationTest 실행 시 환경변수로 자동 주입한다.
// 셸에서 이미 export된 값이 있으면 그쪽이 우선한다(putIfAbsent). 매번 `set -a; source ../.env; set +a`를
// 직접 칠 필요 없이 `./gradlew bootRun` / `./gradlew integrationTest ...`만 실행하면 된다.
def dotenvFile = file("${rootDir}/../.env")
def dotenv = [:]
if (dotenvFile.exists()) {
	dotenvFile.eachLine { line ->
		line = line.trim()
		if (line && !line.startsWith('#') && line.contains('=')) {
			def idx = line.indexOf('=')
			dotenv[line.substring(0, idx).trim()] = line.substring(idx + 1).trim()
		}
	}
}

tasks.withType(JavaExec).configureEach {
	dotenv.each { key, value -> environment.putIfAbsent(key, value) }
}

tasks.withType(Test).configureEach {
	dotenv.each { key, value -> environment.putIfAbsent(key, value) }
}
