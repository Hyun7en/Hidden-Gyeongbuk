plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hiddengyeongbuk'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// *IT 클래스는 실제 DB·외부 API가 필요한 통합 테스트라 기본 test에서 제외한다.
	// 실행: ./gradlew integrationTest
	exclude '**/*IT.class'
}

tasks.register('integrationTest', Test) {
	useJUnitPlatform()
	include '**/*IT.class'
	shouldRunAfter test
}

tasks.withType(Test).configureEach {
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
		showStackTraces = true
		showExceptions = true
		showCauses = true
		showStandardStreams = true
	}
}

// 루트 .env를 읽어 bootRun/test/integrationTest 실행 시 환경변수로 자동 주입한다.
// 셸에서 이미 export된 값이 있으면 그쪽이 우선한다(putIfAbsent). 매번 `set -a; source ../.env; set +a`를
// 직접 칠 필요 없이 `./gradlew bootRun` / `./gradlew integrationTest ...`만 실행하면 된다.
def dotenvFile = file("${rootDir}/../.env")
def dotenv = [:]
if (dotenvFile.exists()) {
	dotenvFile.eachLine { line ->
		line = line.trim()
		if (line && !line.startsWith('#') && line.contains('=')) {
			def idx = line.indexOf('=')
			dotenv[line.substring(0, idx).trim()] = line.substring(idx + 1).trim()
		}
	}
}

tasks.withType(JavaExec).configureEach {
	dotenv.each { key, value -> environment.putIfAbsent(key, value) }
}

tasks.withType(Test).configureEach {
	dotenv.each { key, value -> environment.putIfAbsent(key, value) }
}
