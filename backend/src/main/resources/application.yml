spring:
  application:
    name: backend
  profiles:
    # 프로파일 없이 실행하면 local로 동작한다(개발 편의). 운영 배포는 반드시
    # SPRING_PROFILES_ACTIVE=prod를 지정할 것 — local 전용 빈(/internal 컨트롤러)과
    # SQL 로그가 운영에 노출되지 않게 하는 안전장치다.
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hidden_gyeongbuk}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # LAZY 컬렉션(place.tags 등)을 장소별 단건 쿼리 대신 IN 절로 묶어 가져온다 —
        # 목록 20건 조회가 21쿼리(N+1)에서 2쿼리로 줄어든다.
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 추천 점수 가중치와 코스 제약(아키텍처 §4.3). 코드가 아니라 여기 두는 이유는 조정이 잦아서다 —
# 항목이 5개에서 4개로 줄어든 것이 실제 사례다(ADR-021).
course:
  weights:
    # 합계는 반드시 100. 어긋나면 기동이 실패한다 — 응답은 멀쩡해 보이고 스케일만 조용히
    # 틀어지는 종류의 버그라 요청 시점에는 아무도 못 잡는다.
    interest: 35
    access: 30
    dispersion: 20
    completeness: 15
  constraints:
    # 채점하지 않고 조립만 제약한다(ADR-021). 기간별 룩업 표가 아니라 공식의 계수다 —
    # 날짜 범위 입력이 임의 박 수를 허용해 표로는 표현할 수 없다(ADR-020).
    places-per-day: 3.5
    # 일 수에 비례해 조립 비용과 거리 예산이 늘어나므로 상한을 둔다. 넘으면 400.
    max-nights: 14
    # Dmax = base × days. 난이도가 하루치 이동 예산(km)을 정한다.
    base-distance-km:
      EASY: 60
      NORMAL: 100
      LOCAL: 150
  festival:
    # 여행 날짜와 겹치는 축제에 얹는 후보 선별 가산(추천 알고리즘 §4.7). 점수 항목이 아니라
    # 후보를 고르는 단계의 보정이라 weights 합계 100에 들어가지 않는다.
    # 기간이 안 맞는 축제를 빼는 쪽은 설정으로 끄지 않는다 — 취향이 아니라 정확성 문제다.
    pre-score-bonus: 20

# 언어 레지스트리 — 언어는 데이터이지 코드가 아니다(ADR-018).
# 언어를 늘리는 것은 여기 항목을 추가하는 일이어야 하며, 스키마 변경이나 코드 수정이
# 발생하면 설계 원칙이 깨진 신호로 보고 원인을 점검한다.
# 조회의 폴백 체인·캐시 키와 수집(Collector)의 순회 대상이 모두 이 목록을 따른다.
app:
  language:
    entries:
      - code: ko
        display-name: 한국어
        service-name: KorService2
        active: true
      - code: en
        display-name: English
        service-name: EngService2
        active: true
      # 구조는 N개 언어를 전제하되 실데이터는 국·영문 우선(ADR-018). 일문·중문은
      # 서비스 실측 → 항목 추가 → staging 수집 → Resolve 재실행 → 번역 백필 순으로 켠다.

# (내부 타입, lang) → 소스 contentTypeId 매핑(외부 API 연동 설계서 §2.5).
# 언어마다 코드 체계가 달라서 코드에 분기를 두면 언어 수만큼 분기가 늘어난다.
# 언어 추가는 각 타입에 항목 하나를 더하는 일로 끝나야 한다.
#
# 수집 대상 선정 + lclsSystm1 결측 시 폴백 (ADR-024). place_type 자체는 여기서 오지 않고
# lclsSystm1에서 직접 온다. 여행코스(ko=25)는 다중 스팟 루트라 place 모델과 맞지 않아
# 제외하고(ADR-003/009), 교통(en=77)은 대응하는 국문 타입이 없어 제외한다.
# 매핑에 없는 코드는 수집에서 걸러진다.
#
# fallback이 없는 타입(ATTRACTION)은 대분류가 여럿으로 갈라져 단일 대응이 없다는 뜻이며,
# lclsSystm1이 비면 place를 만들지 않고 quarantine으로 보낸다.
  content-type:
    mappings:
      ATTRACTION:                                  # 대분류가 NA·HS·VE·EX로 갈라짐 → 폴백 없음
        source-type-ids: { ko: 12, en: 76 }
      CULTURAL:
        source-type-ids: { ko: 14, en: 78 }
        fallback: VE
      FESTIVAL:
        source-type-ids: { ko: 15, en: 85 }
        fallback: EV
      LEISURE:
        source-type-ids: { ko: 28, en: 75 }
        fallback: LS
      STAY:
        source-type-ids: { ko: 32, en: 80 }
        fallback: AC
      SHOPPING:
        source-type-ids: { ko: 38, en: 79 }
        fallback: SH
      RESTAURANT:
        source-type-ids: { ko: 39, en: 82 }
        fallback: FD

tourapi:
  service-key: ${TOURAPI_SERVICE_KEY:}
  # 언어별 서비스명은 app.language.entries[].service-name이 갖는다 — 여기 언어를 박으면
  # 언어 추가에 설정 구조가 바뀐다.
  base-url: https://apis.data.go.kr/B551011
  mobile-os: ETC
  mobile-app: HiddenGyeongbuk
sync:
  # 초기 전체 적재가 끝나기 전까지는 false 유지 (TourAPI 개발계정 일 1,000건 호출 한도)
  enabled: ${SYNC_ENABLED:false}
  cron: ${SYNC_CRON:0 0 3 * * *}

translate:
  # 장소 제목/설명 번역 전용(Google Cloud Translation API v2). 2026-07-17부터 이 용도의
  # 엔진을 Gemini에서 여기로 옮김 — 순수 번역엔 전용 API가 더 간단·저렴·안정적이고,
  # Gemini 무료 티어는 향후 챗봇 등 LLM이 실제로 필요한 기능을 위해 남겨둔다.
  api-key: ${TRANSLATE_API_KEY:}
  base-url: https://translation.googleapis.com/language/translate/v2

# Gemini는 지금 어디서도 안 쓰지만, 향후 챗봇 등 LLM 기능을 위해 설정을 남겨둔다.
gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com/v1beta
  # 2026-07-16 실측: gemini-2.0-flash 단종(429), gemini-2.5-flash 신규계정 차단(404),
  # gemini-3-flash라는 이름은 아예 존재하지 않음(정확한 이름은 gemini-3-flash-preview였음, 404) —
  # ListModels(GET /v1beta/models)로 실제 지원 모델 목록을 확인해서 알아냄.
  # 특정 버전을 박아두면 이 문제가 계속 반복되므로, 구글이 "현재 권장 Flash 모델"을 자동으로
  # 가리켜주는 별칭 gemini-flash-latest를 쓴다.
  model: ${GEMINI_MODEL:gemini-flash-latest}
